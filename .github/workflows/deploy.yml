name: Validate and deploy

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [github, cloudflare]
    env:
      DEPLOY_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Setup npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Generate content definitions and thumbnails
        run: npm run prepare-content
      - name: Run code and content checks
        run: npm run check:all
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Build site and check asset budgets
        run: npm run build
      - name: Install browser for verification
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile interactions
        run: npm run test:browser
      - name: Upload browser report and performance measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-report-${{ matrix.target }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Pages artifact
        if: matrix.target == 'github' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
